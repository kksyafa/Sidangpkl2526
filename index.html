<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penilaian Sidang PKL SMK IPTEK Tangsel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scroll::-webkit-scrollbar { display: none; }
        .spin-slow { animation: spin 2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxKLP3DnYyR-MNx8Fbpr2ATbXylijQfsgaqDUG5I6lOBLfbgmsK-dDVrNjtmfZkwqOL/exec"; 

        const SKALA_NILAI = [50, 70, 75, 80, 85, 90, 95, 100];
        const ASPEK = [
            { id: 'laporan', label: 'Laporan', desc: 'Sistematika & Penulisan' },
            { id: 'materi', label: 'Materi', desc: 'Penguasaan Isi PKL' },
            { id: 'presentasi', label: 'Presentasi', desc: 'Kemampuan Bicara' },
            { id: 'tanyaJawab', label: 'Tanya Jawab', desc: 'Ketepatan Jawaban' },
            { id: 'Sikap', label: 'Sikap', desc: 'Etika & Kesopanan' },
        ];

        // Icons
        const IconUser = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const IconSchool = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 22v-4a2 2 0 1 0-4 0v4"/><path d="m18 10 4 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8l4-2"/><path d="M18 5v17"/><path d="m4 6 8-4 8 4"/><path d="M6 5v17"/><circle cx="12" cy="9" r="2"/></svg>;
        const IconGraduation = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>;
        const IconAward = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>;
        const IconRefresh = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const IconHistory = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>;
        const IconDashboard = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>;
        const IconCheck = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
        const IconAlert = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        const IconSpinner = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`spin-slow ${className}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>;

        function App() {
            const [dbSiswa, setDbSiswa] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [submitting, setSubmitting] = useState(false);
            const [activeTab, setActiveTab] = useState('input');
            const [status, setStatus] = useState(null);
            
            const [form, setForm] = useState({
                penguji: '', 
                siswa: '',
                nilai: { laporan: 0, materi: 0, presentasi: 0, tanyaJawab: 0, Sikap: 0 }
            });

            const cleanString = (str) => {
                if (!str) return "";
                return String(str).replace(/^["']|["']$/g, '').trim();
            };

            const fetchData = async () => {
                setLoading(true);
                setError(null);
                try {
                    const resp = await fetch(WEB_APP_URL);
                    if (!resp.ok) throw new Error("Gagal mengambil data dari Google Script.");
                    const rawData = await resp.json();
                    
                    if (!Array.isArray(rawData) || rawData.length === 0) {
                        throw new Error("Data kosong atau format tidak sesuai.");
                    }

                    let lastKnownPenguji = "";
                    let lastKnownKelas = "";

                    const processed = rawData.map(row => {
                        // Handle case-insensitivity untuk header (Penguji vs penguji)
                        const pRaw = row.Penguji || row.penguji || "";
                        const kRaw = row.Kelas || row.kelas || "";
                        const sRaw = row.Siswa || row.siswa || "";

                        const pClean = cleanString(pRaw);
                        const kClean = cleanString(kRaw);
                        const sClean = cleanString(sRaw);

                        if (pClean) lastKnownPenguji = pClean;
                        if (kClean) lastKnownKelas = kClean;

                        return {
                            penguji: lastKnownPenguji,
                            kelas: lastKnownKelas,
                            nama: sClean
                        };
                    }).filter(item => item.nama !== "");

                    setDbSiswa(processed);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchData(); }, []);

            const listPenguji = useMemo(() => {
                return [...new Set(dbSiswa.map(item => item.penguji))].filter(Boolean).sort();
            }, [dbSiswa]);
            
            const listSiswaTersedia = useMemo(() => {
                return dbSiswa.filter(s => s.penguji === form.penguji);
            }, [form.penguji, dbSiswa]);
            
            const detailSiswaTerpilih = useMemo(() => {
                return listSiswaTersedia.find(s => s.nama === form.siswa) || null;
            }, [form.siswa, listSiswaTersedia]);

            const totalNilai = useMemo(() => {
                const vals = Object.values(form.nilai);
                const sum = vals.reduce((a, b) => a + b, 0);
                return sum > 0 ? Math.round(sum / 5) : 0;
            }, [form.nilai]);

            const handleSave = async () => {
                if (!detailSiswaTerpilih) return;
                setSubmitting(true);
                const payload = {
                    tanggal: new Date().toLocaleString('id-ID'),
                    penguji: form.penguji,
                    kelas: detailSiswaTerpilih.kelas,
                    siswa: form.siswa,
                    ...form.nilai,
                    total: totalNilai
                };

                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify(payload)
                    });
                    setStatus({ type: 'success', msg: 'Nilai Berhasil Dikirim!' });
                    setForm(prev => ({ 
                        ...prev, 
                        siswa: '', 
                        nilai: { laporan: 0, materi: 0, presentasi: 0, tanyaJawab: 0, Sikap: 0 } 
                    }));
                    setTimeout(() => setStatus(null), 3000);
                } catch (err) {
                    setStatus({ type: 'error', msg: 'Gagal mengirim data.' });
                } finally {
                    setSubmitting(false);
                }
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-emerald-900 text-white p-10 text-center">
                    <IconRefresh size={54} className="spin-slow text-emerald-300 mb-6" />
                    <h2 className="font-extrabold text-2xl uppercase italic">SMK IPTEK</h2>
                    <p className="text-[10px] opacity-60 font-bold tracking-[0.3em]">MENGHUBUNGKAN DATA MASTER...</p>
                </div>
            );

            if (error) return (
                <div className="h-screen flex flex-col items-center justify-center bg-slate-50 p-10 text-center">
                    <IconAlert size={48} className="text-red-500 mb-4" />
                    <p className="text-sm text-slate-600 mb-6 font-bold">{error}</p>
                    <button onClick={fetchData} className="bg-emerald-600 text-white px-8 py-3 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg active:scale-95">Coba Lagi</button>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col border-x border-slate-200 shadow-2xl relative">
                    <header className="bg-emerald-800 p-6 pt-12 text-white rounded-b-[3rem] shadow-xl relative z-10">
                        <div className="flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-white/10 rounded-2xl border border-white/20"><IconGraduation size={28} /></div>
                                <div>
                                    <h1 className="text-xl font-black uppercase italic leading-none">SMK IPTEK</h1>
                                    <p className="text-[9px] font-bold opacity-70 tracking-[0.2em] uppercase mt-1">PENILAIAN SIDANG PKL</p>
                                </div>
                            </div>
                            <button onClick={fetchData} className="p-2.5 bg-white/10 rounded-full active:rotate-180 transition-all"><IconRefresh size={20} /></button>
                        </div>
                    </header>

                    <main className="flex-1 px-4 py-8 overflow-y-auto custom-scroll pb-40">
                        {activeTab === 'input' ? (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 flex items-center gap-2"><IconUser size={12} className="text-emerald-600" /> Nama Penguji</label>
                                        <select className="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500 appearance-none shadow-inner"
                                            value={form.penguji} onChange={(e) => setForm({...form, penguji: e.target.value, siswa: ''})}>
                                            <option value="">-- Pilih Penguji --</option>
                                            {listPenguji.map((p, i) => <option key={i} value={p}>{p}</option>)}
                                        </select>
                                    </div>
                                    {form.penguji && (
                                        <div className="space-y-2 animate-in fade-in slide-in-from-top-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 flex items-center gap-2"><IconAward size={12} className="text-emerald-600" /> Peserta Sidang</label>
                                            <select className="w-full p-4 bg-emerald-50 border-2 border-emerald-100 rounded-2xl text-sm font-black text-emerald-900 appearance-none transition-all"
                                                value={form.siswa} onChange={(e) => setForm({...form, siswa: e.target.value})}>
                                                <option value="">-- Pilih Nama Siswa --</option>
                                                {listSiswaTersedia.map((s, i) => <option key={i} value={s.nama}>{s.nama}</option>)}
                                            </select>
                                            {detailSiswaTerpilih && <div className="mt-3 px-4 py-2 bg-emerald-600 text-white text-[10px] font-black rounded-xl inline-flex items-center gap-2 shadow-md"><IconSchool size={12} /> KELAS: {detailSiswaTerpilih.kelas}</div>}
                                        </div>
                                    )}
                                </div>

                                {form.siswa && ASPEK.map((aspek) => (
                                    <div key={aspek.id} className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm animate-in fade-in slide-in-from-bottom-4">
                                        <div className="mb-4 flex justify-between items-center">
                                            <div>
                                                <span className="text-sm font-extrabold text-slate-800 uppercase">{aspek.label}</span>
                                                <p className="text-[10px] text-slate-400 font-bold italic">{aspek.desc}</p>
                                            </div>
                                            {form.nilai[aspek.id] > 0 && <div className="w-9 h-9 bg-emerald-600 rounded-full flex items-center justify-center text-white text-xs font-black shadow-lg">{form.nilai[aspek.id]}</div>}
                                        </div>
                                        <div className="grid grid-cols-4 gap-2">
                                            {SKALA_NILAI.map(n => (
                                                <button key={n} onClick={() => setForm({ ...form, nilai: { ...form.nilai, [aspek.id]: n } })}
                                                    className={`py-3 rounded-xl text-[11px] font-black transition-all active:scale-90 ${form.nilai[aspek.id] === n ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-50 text-slate-400 hover:bg-slate-100'}`}>
                                                    {n}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="h-96 flex flex-col items-center justify-center text-slate-300">
                                <IconHistory size={80} className="opacity-10 mb-4" />
                                <p className="text-xs font-black uppercase tracking-[0.4em]">Rekap Nilai</p>
                                <p className="text-[10px] mt-2 italic font-bold text-center px-12">Hasil sinkronisasi otomatis ke Google Sheets tab "Hasil".</p>
                            </div>
                        )}
                    </main>

                    {activeTab === 'input' && form.siswa && (
                        <div className="fixed bottom-24 left-4 right-4 bg-white/80 backdrop-blur-xl p-4 rounded-[2.5rem] shadow-2xl border border-white/50 flex items-center gap-4 z-40">
                            <div className="bg-slate-900 px-5 py-3 rounded-3xl flex flex-col items-center justify-center min-w-[80px]">
                                <span className="text-[7px] font-black text-slate-500 uppercase tracking-tighter">SKOR</span>
                                <span className="text-xl font-black text-white">{totalNilai || '--'}</span>
                            </div>
                            <button disabled={submitting || totalNilai === 0} onClick={handleSave}
                                className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-3xl font-black text-xs flex items-center justify-center gap-3 active:scale-95 disabled:opacity-30 shadow-xl uppercase tracking-widest transition-all">
                                {submitting ? <IconSpinner size={18} /> : "Kirim Penilaian"}
                            </button>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 h-20 flex items-center justify-around px-10 pb-2 z-50">
                        <button onClick={() => setActiveTab('input')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'input' ? 'text-emerald-700 scale-110' : 'text-slate-300'}`}>
                            <IconDashboard size={20} />
                            <span className="text-[9px] font-black uppercase tracking-widest">Input</span>
                        </button>
                        <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'history' ? 'text-emerald-700 scale-110' : 'text-slate-300'}`}>
                            <IconHistory size={20} />
                            <span className="text-[9px] font-black uppercase tracking-widest">Rekap</span>
                        </button>
                    </nav>

                    {status && (
                        <div className={`fixed top-8 left-4 right-4 p-4 rounded-2xl flex items-center gap-3 shadow-2xl z-[100] animate-bounce text-white ${status.type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>
                            {status.type === 'success' ? <IconCheck size={20} /> : <IconAlert size={20} />}
                            <span className="text-xs font-black uppercase tracking-tight">{status.msg}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
