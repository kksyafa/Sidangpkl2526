<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penilaian Sidang PKL IPTEK Tangsel</title>
    <!-- Tailwind CSS untuk UI Mobile Friendly -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 untuk Notifikasi Pop-up -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); padding-bottom: 2rem; }
        /* Hilangkan scrollbar bawaan */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .radio-btn-label:has(input:checked) { background-color: #4f46e5; color: white; border-color: #4f46e5; font-weight: bold; }
        .radio-btn-label { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="text-gray-800 antialiased">

<div class="app-container relative">
    <!-- Header Aplikasi -->
    <header class="bg-indigo-600 text-white p-5 rounded-b-3xl shadow-md sticky top-0 z-20">
        <h1 class="text-xl font-bold tracking-tight">Sidang PKL '25/26</h1>
        <p class="text-sm text-indigo-200 mt-1">SMK IPTEK TANGSEL</p>
    </header>

    <main class="p-5">
        <form id="formPenilaian" class="space-y-6">
            
            <!-- SECTION: DATA PESERTA -->
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-4">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest border-b border-gray-100 pb-2">Data Peserta Ujian</h2>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Penguji</label>
                    <select id="penguji" class="w-full border border-gray-300 rounded-xl p-3 bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none text-sm appearance-none" required>
                        <option value="" disabled selected>Memuat data penguji...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Siswa</label>
                    <select id="siswa" class="w-full border border-gray-300 rounded-xl p-3 bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none text-sm appearance-none disabled:bg-gray-200 disabled:text-gray-400" disabled required>
                        <option value="" disabled selected>-- Pilih Siswa --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Kelas</label>
                    <input type="text" id="kelas" class="w-full border border-gray-300 rounded-xl p-3 bg-gray-100 text-gray-600 text-sm font-medium outline-none cursor-not-allowed" readonly placeholder="Otomatis terisi dari data siswa">
                </div>
            </div>

            <!-- SECTION: PENILAIAN -->
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-6">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest border-b border-gray-100 pb-2">Aspek Penilaian</h2>
                <div id="aspekContainer" class="space-y-6"></div>
            </div>

            <!-- SECTION: HASIL -->
            <div class="bg-indigo-50 rounded-2xl border border-indigo-100 p-6 text-center shadow-inner">
                <p class="text-sm text-indigo-800 font-bold tracking-widest mb-1">TOTAL NILAI (RATA-RATA)</p>
                <div id="totalNilai" class="text-6xl font-black text-indigo-600">0</div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95 flex justify-center items-center gap-2 text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                Simpan Penilaian
            </button>
        </form>
    </main>
</div>

<script>
    // 1. URL API SHEETDB (Ganti dengan URL API SheetDB Anda nanti)
    // Cara buat: Login ke sheetdb.io -> Create API -> Masukkan Link Spreadsheet Anda -> Copy API URL nya kesini
    const API_URL = "https:/bsheetdb.io/api/v1/7sbk4195aqneo"; 

    // Konfigurasi Aspek Penilaian sesuai permintaan
    const aspekPenilaian = [
        { id: 'Laporan', title: 'Penyusunan Laporan' },
        { id: 'Materi', title: 'Pemahaman Materi', desc: 'Penguasaan isi & implementasi' },
        { id: 'Presentasi', title: 'Presentasi', desc: 'Kepercayaan diri, intonasi, kontak mata' },
        { id: 'TanyaJawab', title: 'Tanya Jawab', desc: 'Ketepatan jawaban & argumentasi' },
        { id: 'Sikap', title: 'Sikap dan Etika', desc: 'Kesopanan & profesionalisme' }
    ];
    const pilihanNilai = [50, 70, 75, 80, 85, 90, 95, 100];
    let dataMaster = [];

    // 2. Render UI Penilaian
    const aspekContainer = document.getElementById('aspekContainer');
    aspekPenilaian.forEach(aspek => {
        let html = `
            <div>
                <label class="block text-sm font-bold text-gray-800 mb-1">${aspek.title}</label>
                ${aspek.desc ? `<p class="text-xs text-gray-500 mb-3">${aspek.desc}</p>` : ''}
                <div class="grid grid-cols-4 gap-2">
                    ${pilihanNilai.map(nilai => `
                        <label class="radio-btn-label cursor-pointer relative rounded-xl border border-gray-200 py-3 text-center text-sm font-semibold text-gray-600 bg-white hover:bg-indigo-50 shadow-sm flex items-center justify-center">
                            <input type="radio" name="${aspek.id}" value="${nilai}" class="sr-only" required onchange="hitungTotal()">
                            ${nilai}
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
        aspekContainer.insertAdjacentHTML('beforeend', html);
    });

    // 3. Fungsi Membaca CSV dengan perbaikan duplikat Penguji
    function parseCSVData(csvText) {
        const rows = [];
        let inQuotes = false;
        let val = '';
        let row = [];
        
        // Memecah CSV dengan mengabaikan koma di dalam tanda kutip
        for (let i = 0; i < csvText.length; i++) {
            let char = csvText[i];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { row.push(val.trim()); val = ''; }
            else if (char === '\n' && !inQuotes) { row.push(val.trim()); rows.push(row); row = []; val = ''; }
            else val += char;
        }
        row.push(val.trim());
        rows.push(row);

        const formattedData = [];
        let currentPenguji = "";

        // Mulai dari baris 1 (mengabaikan header di baris 0)
        for (let i = 1; i < rows.length; i++) {
            if (rows[i].length < 3) continue; // Skip jika baris tidak lengkap

            // Bersihkan tanda kutip berlebih
            let penguji = rows[i][0].replace(/^"|"$/g, '').trim();
            let kelas = rows[i][1].replace(/^"|"$/g, '').trim();
            let siswa = rows[i][2].replace(/^"|"$/g, '').trim();

            // LOGIKA UTAMA: Jika kolom penguji kosong, gunakan nama penguji dari baris sebelumnya
            if (penguji !== "") {
                currentPenguji = penguji;
            } else {
                penguji = currentPenguji;
            }

            if (siswa !== "" && penguji !== "") {
                formattedData.push({ penguji, kelas, siswa });
            }
        }
        return formattedData;
    }

    // 4. Memuat Data dari DataMaster.csv
    async function initAplikasi() {
        try {
            // Membaca file DataMaster.csv yang diletakkan di repo Github yang sama
            const response = await fetch('./DataMaster.csv');
            if(!response.ok) throw new Error("File tidak ditemukan");
            const csvText = await response.text();
            
            dataMaster = parseCSVData(csvText);
            
            // Masukkan ke Dropdown Penguji (Hapus Duplikat)
            const selectPenguji = document.getElementById('penguji');
            selectPenguji.innerHTML = '<option value="" disabled selected>-- Pilih Penguji --</option>';
            
            const daftarPengujiUnik = [...new Set(dataMaster.map(item => item.penguji))].sort();
            
            daftarPengujiUnik.forEach(nama => {
                let opt = document.createElement('option');
                opt.value = nama;
                opt.textContent = nama;
                selectPenguji.appendChild(opt);
            });
            
        } catch (error) {
            Swal.fire('Error', 'Gagal memuat DataMaster.csv. Pastikan file ada di folder yang sama.', 'error');
            document.getElementById('penguji').innerHTML = '<option value="" disabled selected>Data Gagal Dimuat</option>';
        }
    }

    // 5. Interaksi Dropdown
    document.getElementById('penguji').addEventListener('change', function() {
        const pengujiTerpilih = this.value;
        const selectSiswa = document.getElementById('siswa');
        const inputKelas = document.getElementById('kelas');
        
        selectSiswa.innerHTML = '<option value="" disabled selected>-- Pilih Siswa --</option>';
        selectSiswa.disabled = false;
        inputKelas.value = '';

        // Filter daftar anak berdasarkan penguji
        const dataAnak = dataMaster.filter(item => item.penguji === pengujiTerpilih);
        
        dataAnak.forEach(item => {
            let opt = document.createElement('option');
            opt.value = item.siswa;
            opt.textContent = item.siswa;
            opt.dataset.kelas = item.kelas; 
            selectSiswa.appendChild(opt);
        });
    });

    document.getElementById('siswa').addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        document.getElementById('kelas').value = selectedOption.dataset.kelas || '';
    });

    // 6. Hitung Rata-rata Nilai
    window.hitungTotal = function() {
        let total = 0;
        let jumlahTerisi = 0;
        aspekPenilaian.forEach(aspek => {
            const terpilih = document.querySelector(`input[name="${aspek.id}"]:checked`);
            if (terpilih) {
                total += parseInt(terpilih.value);
                jumlahTerisi++;
            }
        });

        if (jumlahTerisi === 5) {
            document.getElementById('totalNilai').innerText = (total / 5).toFixed(0);
        }
    };

    // 7. Pengiriman Data ke Spreadsheet via API
    document.getElementById('formPenilaian').addEventListener('submit', function(e) {
        e.preventDefault();

        const btnSubmit = document.getElementById('btnSubmit');
        const totalNilai = document.getElementById('totalNilai').innerText;
        
        if(totalNilai === '0') {
            Swal.fire('Belum Lengkap', 'Pastikan semua aspek penilaian telah diisi.', 'warning');
            return;
        }

        // Susun Data sesuai Header di file Hasil.csv
        const payload = {
            Tanggal: new Date().toLocaleDateString('id-ID'),
            Penguji: document.getElementById('penguji').value,
            Kelas: document.getElementById('kelas').value,
            Siswa: document.getElementById('siswa').value,
            Laporan: document.querySelector('input[name="Laporan"]:checked').value,
            Materi: document.querySelector('input[name="Materi"]:checked').value,
            Presentasi: document.querySelector('input[name="Presentasi"]:checked').value,
            TanyaJawab: document.querySelector('input[name="TanyaJawab"]:checked').value,
            Sikap: document.querySelector('input[name="Sikap"]:checked').value,
            Total: totalNilai
        };

        btnSubmit.innerHTML = 'Menyimpan Data...';
        btnSubmit.disabled = true;

        if (API_URL === "URL_API_SHEETDB_ANDA_DISINI") {
            Swal.fire({
                title: 'Data Berhasil Dibuat!',
                text: 'Namun data BELUM MASUK ke Spreadsheet karena Anda belum memasukkan URL API SheetDB. Silakan ikuti panduan.',
                icon: 'info'
            });
            btnSubmit.innerHTML = 'Simpan Penilaian';
            btnSubmit.disabled = false;
            return;
        }

        // Kirim data menggunakan format SheetDB
        fetch(API_URL, {
            method: 'POST',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ data: [payload] })
        })
        .then(response => response.json())
        .then(data => {
            Swal.fire('Berhasil!', 'Nilai sidang berhasil disimpan ke Spreadsheet.', 'success');
            document.getElementById('formPenilaian').reset();
            document.getElementById('totalNilai').innerText = '0';
            document.getElementById('kelas').value = '';
            document.getElementById('siswa').innerHTML = '<option value="" disabled selected>-- Pilih Siswa --</option>';
            document.getElementById('siswa').disabled = true;
        })
        .catch(error => {
            Swal.fire('Gagal!', 'Terjadi kesalahan jaringan saat menyimpan data.', 'error');
            console.error('Error:', error);
        })
        .finally(() => {
            btnSubmit.innerHTML = 'Simpan Penilaian';
            btnSubmit.disabled = false;
        });
    });

    // Jalankan inisialisasi awal
    initAplikasi();
</script>
</body>
</html>
